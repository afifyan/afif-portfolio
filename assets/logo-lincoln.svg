<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 54" width="225" height="54" role="img" aria-label="Lincoln University New Zealand">
  <!-- Official Lincoln University Heraldic Crest & Te Whare Wānaka o Aoraki Brand Identity -->
  <g transform="translate(6, 4)">
    <!-- Heraldic Shield Base in Lincoln Navy & Gold Trim -->
    <path d="M4 2 L34 2 C34 2 34 23 34 25 C34 35 19 43 19 43 C19 43 4 35 4 25 Z" fill="#002137" stroke="#C5A059" stroke-width="1.8"/>
    <!-- Quartering Cross in Gold -->
    <line x1="4" y1="20" x2="34" y2="20" stroke="#C5A059" stroke-width="1.2"/>
    <line x1="19" y1="2" x2="19" y2="41" stroke="#C5A059" stroke-width="1.2"/>
    
    <!-- Q1: Open Book of Learning -->
    <path d="M7.8 9.5 C10.8 8.5 13.5 8.5 15.5 9.5 L15.5 15.5 C13.5 14.5 10.8 14.5 7.8 15.5 Z" fill="#FFFFFF"/>
    <path d="M8 12 L14.5 11.5" stroke="#002137" stroke-width="0.6"/>
    <path d="M8 14 L14.5 13.5" stroke="#002137" stroke-width="0.6"/>
    
    <!-- Q2: Golden Fleece / Ram (Pastoral Heritage) -->
    <ellipse cx="26.5" cy="11" rx="4.5" ry="3.2" fill="#C5A059"/>
    <circle cx="23" cy="9.8" r="2" fill="#C5A059"/>
    <path d="M22 11 C21.5 11.5 21 12 21 13" stroke="#002137" stroke-width="0.8" fill="none"/>
    <rect x="24" y="14" width="1.2" height="3" fill="#C5A059"/>
    <rect x="27.5" y="14" width="1.2" height="3" fill="#C5A059"/>
    
    <!-- Q3: Wheat Sheaf (Agriculture & Soils) -->
    <path d="M8 33 C11 29 12 25 10 23 C13 23 14 27 12 33 Z" fill="#C5A059"/>
    <path d="M12 33 C13 29 15 25 14 23 C16 24 16 28 14 33 Z" fill="#C5A059"/>
    <line x1="8" y1="28" x2="14" y2="28" stroke="#FFFFFF" stroke-width="1"/>
    
    <!-- Q4: Southern Cross / Heraldic Stars -->
    <polygon points="26.5,23 27.2,24.8 29,24.8 27.5,26 28.1,27.8 26.5,26.6 24.9,27.8 25.5,26 24,24.8 25.8,24.8" fill="#C5A059"/>
    <polygon points="22.5,28.5 23,29.7 24.2,29.7 23.2,30.5 23.6,31.7 22.5,30.9 21.4,31.7 21.8,30.5 20.8,29.7 22,29.7" fill="#C5A059"/>
    <polygon points="30.5,28.5 31,29.7 32.2,29.7 31.2,30.5 31.6,31.7 30.5,30.9 29.4,31.7 29.8,30.5 28.8,29.7 30,29.7" fill="#C5A059"/>
    <polygon points="26.5,33.5 27,34.7 28.2,34.7 27.2,35.5 27.6,36.7 26.5,35.9 25.4,36.7 25.8,35.5 24.8,34.7 26,34.7" fill="#C5A059"/>
  </g>
  <!-- Authentic Lincoln University Typography -->
  <text x="50" y="20" font-family="Avenir, Montserrat, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="11.8" fill="#002137" letter-spacing="0.02em">LINCOLN UNIVERSITY</text>
  <text x="50" y="32" font-family="Inter, Roboto, Arial, sans-serif" font-weight="700" font-size="7.2" fill="#B58110" letter-spacing="0.04em">TE WHARE WĀNAKA O AORAKI</text>
  <text x="50" y="43" font-family="Inter, Roboto, Arial, sans-serif" font-weight="600" font-size="6.4" fill="#475569" letter-spacing="0.08em">NEW ZEALAND</text>
</svg>